# Generar render.yaml mejorado
render_yaml = '''services:
  - type: web
    name: biblioteca-microservices
    env: node
    buildCommand: |
      npm install
      npx prisma generate --schema=./prisma/schema.prisma
      npx prisma db push --schema=./prisma/schema.prisma --accept-data-loss
